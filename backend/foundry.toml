[profile.default]
# Solidity contracts remain at the repository root; Foundry tooling lives here.
src = "../contracts"
test = "foundry-test"
out = "foundry-out"
cache_path = "foundry-cache"
solc_version = "0.8.19"
evm_version = "paris"
optimizer = true
optimizer_runs = 200
remappings = ["contracts/=../contracts/"]

[fmt]
line_length = 100
tab_width = 4
