Organizations:

  - &OrdererOrg
    Name: OrdererOrg
    ID: OrdererMSP
    MSPDir: organizations/ordererOrganizations/example.com/msp

    Policies:
      Readers:
        Type: Signature
        Rule: "OR('OrdererMSP.member')"
      Writers:
        Type: Signature
        Rule: "OR('OrdererMSP.member')"
      Admins:
        Type: Signature
        Rule: "OR('OrdererMSP.admin')"

  - &Healthcare
    Name: HealthcareMSP
    ID: HealthcareMSP
    MSPDir: organizations/peerOrganizations/healthcare.example.com/msp

    Policies:
      Readers:
        Type: Signature
        Rule: "OR('HealthcareMSP.admin', 'HealthcareMSP.peer', 'HealthcareMSP.client')"
      Writers:
        Type: Signature
        Rule: "OR('HealthcareMSP.admin', 'HealthcareMSP.client')"
      Admins:
        Type: Signature
        Rule: "OR('HealthcareMSP.admin')"
      Endorsement:
        Type: Signature
        Rule: "OR('HealthcareMSP.peer')"

    AnchorPeers:
      - Host: peer0.healthcare.example.com
        Port: 7051

  - &Insurance
    Name: InsuranceMSP
    ID: InsuranceMSP
    MSPDir: organizations/peerOrganizations/insurance.example.com/msp

    Policies:
      Readers:
        Type: Signature
        Rule: "OR('InsuranceMSP.admin', 'InsuranceMSP.peer', 'InsuranceMSP.client')"
      Writers:
        Type: Signature
        Rule: "OR('InsuranceMSP.admin', 'InsuranceMSP.client')"
      Admins:
        Type: Signature
        Rule: "OR('InsuranceMSP.admin')"
      Endorsement:
        Type: Signature
        Rule: "OR('InsuranceMSP.peer')"

    AnchorPeers:
      - Host: peer0.insurance.example.com
        Port: 9051


Capabilities:

  Channel: &ChannelCapabilities
    V2_0: true

  Orderer: &OrdererCapabilities
    V2_0: true

  Application: &ApplicationCapabilities
    V2_0: true


Application: &ApplicationDefaults

  Organizations:

  Policies:
    Readers:
      Type: ImplicitMeta
      Rule: "ANY Readers"
    Writers:
      Type: ImplicitMeta
      Rule: "ANY Writers"
    Admins:
      Type: ImplicitMeta
      Rule: "MAJORITY Admins"
    LifecycleEndorsement:
      Type: ImplicitMeta
      Rule: "MAJORITY Endorsement"
    Endorsement:
      Type: ImplicitMeta
      Rule: "MAJORITY Endorsement"

  Capabilities:
    <<: *ApplicationCapabilities


Orderer: &OrdererDefaults

  OrdererType: etcdraft

  Addresses:
    - orderer.example.com:7050

  EtcdRaft:
    Consenters:
      - Host: orderer.example.com
        Port: 7050
        ClientTLSCert: organizations/ordererOrganizations/example.com/orderers/orderer.example.com/tls/server.crt
        ServerTLSCert: organizations/ordererOrganizations/example.com/orderers/orderer.example.com/tls/server.crt

  BatchTimeout: 2s

  BatchSize:
    MaxMessageCount: 10
    AbsoluteMaxBytes: 99 MB
    PreferredMaxBytes: 512 KB

  Organizations:

  Policies:
    Readers:
      Type: ImplicitMeta
      Rule: "ANY Readers"
    Writers:
      Type: ImplicitMeta
      Rule: "ANY Writers"
    Admins:
      Type: ImplicitMeta
      Rule: "MAJORITY Admins"
    BlockValidation:
      Type: ImplicitMeta
      Rule: "ANY Writers"

  Capabilities:
    <<: *OrdererCapabilities


Channel: &ChannelDefaults

  Policies:
    Readers:
      Type: ImplicitMeta
      Rule: "ANY Readers"
    Writers:
      Type: ImplicitMeta
      Rule: "ANY Writers"
    Admins:
      Type: ImplicitMeta
      Rule: "MAJORITY Admins"

  Capabilities:
    <<: *ChannelCapabilities


Profiles:

  MedivaultChannel:
    <<: *ChannelDefaults

    Orderer:
      <<: *OrdererDefaults
      Organizations:
        - *OrdererOrg

    Application:
      <<: *ApplicationDefaults
      Organizations:
        - *Healthcare
        - *Insurance